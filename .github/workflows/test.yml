name: Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "**.png"
      - "**.jpg"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "**.png"
      - "**.jpg"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt 2>&1

      - name: Run tests
        env:
          DEEPSEEK_API_KEY: "sk-test-ci-placeholder"
        run: python -m pytest tests/ -v --ignore=tests/test_rag.py --ignore=tests/test_rag_extensions.py --ignore=tests/test_agent_graph.py --tb=short 2>&1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug
        run: node --version && npm --version

      - name: Install
        run: npm install --legacy-peer-deps 2>&1

      - name: Build
        run: npm run build 2>&1
