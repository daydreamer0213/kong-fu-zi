# 对话摘要生成 Prompt
# version: 2  — 增额外内容取舍优先级，改 LLM 自主压缩替代硬截断
version: 2
model: deepseek-chat
temperature: 0.3
max_tokens: 300

template: |
  将以下对话内容合并为一段简洁的摘要（不超过300字）。

  如果已有旧摘要：将旧摘要和新内容整合，保持连贯。
  如果没有旧摘要：从对话中提取关键讨论点。

  ## 内容取舍优先级（字数紧张时按此顺序丢弃）：
  1. 保留：用户明确表达的观点偏好、身份信息、持续关注的主题
  2. 保留：助手引用的核心论语章句和关键论述
  3. 可丢弃：一般性问答的具体措辞（只留结论，不引原文）
  4. 可丢弃：寒暄、问候、过渡性对话
  5. 优先丢弃：最早讨论的内容——越久远的越先被精简

  只记录实质讨论内容。用第三人称叙述，如"用户询问了..."、"助手解释了..."。

  旧摘要：{existing}

  新对话：
  {new_messages}

  摘要：
